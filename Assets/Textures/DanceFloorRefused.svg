<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <!-- Same corner-to-corner sweep and the same three stops as the normal
         floor, so the refusal reads as the same surface in a different colour
         rather than a different object. Light red at the near corner falling
         to dark at the far one. -->
    <linearGradient id="sweep" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#E8776B"/>
      <stop offset="50%"  stop-color="#C0392B"/>
      <stop offset="100%" stop-color="#6E1710"/>
    </linearGradient>
    <filter id="soften" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="34"/>
    </filter>
    <mask id="edges">
      <rect x="76" y="76" width="360" height="360" rx="64" fill="#ffffff" filter="url(#soften)"/>
    </mask>
  </defs>
  <rect width="512" height="512" fill="url(#sweep)" mask="url(#edges)"/>
</svg>
