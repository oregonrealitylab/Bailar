<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <filter id="soften" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="34"/>
    </filter>
  </defs>
  <rect width="512" height="512" fill="#000000"/>
  <!-- White is opaque, black is gone. Blurring the rounded rect gives the same
       soft ramp on all four sides at once. -->
  <rect x="76" y="76" width="360" height="360" rx="64" fill="#ffffff" filter="url(#soften)"/>
</svg>
