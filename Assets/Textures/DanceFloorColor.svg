<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="sweep" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#6B4BA8"/>
      <stop offset="50%"  stop-color="#4A6E9E"/>
      <stop offset="100%" stop-color="#35A88C"/>
    </linearGradient>
  </defs>
  <!-- Fully opaque, edge to edge. The fade lives in the opacity texture, so
       there are no transparent pixels here to bleed white as alpha drops. -->
  <rect width="512" height="512" fill="url(#sweep)"/>
</svg>
