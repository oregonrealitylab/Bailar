<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <!-- The UI's violet-to-teal sweep, run corner to corner. -->
    <linearGradient id="sweep" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#6B4BA8"/>
      <stop offset="50%"  stop-color="#4A6E9E"/>
      <stop offset="100%" stop-color="#35A88C"/>
    </linearGradient>
    <!-- Blurring a white rounded rect gives a soft alpha ramp on all four
         sides at once, which four separate edge gradients cannot do without
         the corners going wrong where they overlap. -->
    <filter id="soften" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="34"/>
    </filter>
    <mask id="edges">
      <rect x="76" y="76" width="360" height="360" rx="64" fill="#ffffff" filter="url(#soften)"/>
    </mask>
  </defs>
  <rect width="512" height="512" fill="url(#sweep)" mask="url(#edges)"/>
</svg>
